name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**", "docs/**", "chore/**"]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.9"
  PNPM_VERSION: "12.21.0"
  NODE_VERSION: "26"

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      # The full history is needed by the diff coverage gate.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies from the lock
        run: uv sync --frozen --group dev

      - name: Run every gate
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
        run: uv run --no-sync python scripts/verify.py --base "origin/${BASE_REF}"

  typescript:
    name: TypeScript
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: 12.21.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install dependencies from the lock
        run: pnpm install --frozen-lockfile

      - name: Typecheck and test with full coverage
        run: pnpm run verify

  attribution:
    name: Commit attribution
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject AI attribution in new commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            RANGE="${BASE}..HEAD"
          else
            RANGE="HEAD~1..HEAD"
          fi
          python3 scripts/check_attribution.py --range "$RANGE"

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"

      - name: Install dependencies from the lock
        run: uv sync --frozen --group dev

      - name: Reject known vulnerabilities
        run: uv run --no-sync python scripts/audit_dependencies.py

  review:
    name: Maintainer review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Require the maintainer approval
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          NUMBER: ${{ github.event.pull_request.number }}
          MAINTAINER: Espoir-Loem
        run: |
          if [ "$AUTHOR" = "$MAINTAINER" ]; then
            echo "Maintainer pull request: no separate validation needed"
            exit 0
          fi
          COUNT=$(gh api "repos/$GH_REPO/pulls/$NUMBER/reviews" --paginate \
            --jq "[.[] | select(.state == \"APPROVED\" and .user.login == \"$MAINTAINER\")] | length")
          test "$COUNT" -ge 1

  build:
    name: Build distributions
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: false

      - name: Build sdist and wheel
        run: uv build --no-sources

      - name: Smoke test wheel
        run: |
          EXPECTED="$(uv version --short)"
          ACTUAL="$(uv run --isolated --no-project --with dist/*.whl python -c 'import nexy_auth; print(nexy_auth.__version__)')"
          test "$EXPECTED" = "$ACTUAL"

      - name: Smoke test source distribution
        run: |
          EXPECTED="$(uv version --short)"
          ACTUAL="$(uv run --isolated --no-project --with dist/*.tar.gz python -c 'import nexy_auth; print(nexy_auth.__version__)')"
          test "$EXPECTED" = "$ACTUAL"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error
